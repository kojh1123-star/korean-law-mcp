name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # OAuth persistence uses the built-in node:sqlite module.
        node-version: [22.13.0, 24.x]

    steps:
      # v4 (current tag target at time of pinning)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js ${{ matrix.node-version }}
        # v4 (current tag target at time of pinning)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        # Dev tooling has platform-specific optional bindings; install them but
        # never execute transitive lifecycle scripts.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify packed artifact
        run: npm run verify:package

      - name: Verify production graph without optional dependencies
        run: |
          npm prune --omit=dev --omit=optional --ignore-scripts
          npm run verify:annex-runtime

  oauth-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Railway image
        run: docker build -t law-mcp-oauth-check .
      - name: Verify mounted OAuth storage and unprivileged runtime
        run: >-
          docker run --rm -e OAUTH_ENABLED=1 -v /data law-mcp-oauth-check
          node --input-type=module -e
          'import { DatabaseSync } from "node:sqlite";
          if (process.getuid() === 0) throw new Error("Runtime must not be root");
          const db = new DatabaseSync("/data/oauth/check.sqlite");
          db.exec("CREATE TABLE check_storage (id INTEGER)"); db.close();'
