name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Fork guard: the npm package and its trusted publisher belong to the upstream repository.
    if: github.repository == 'chrisryugj/korean-law-mcp'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use an npm CLI with trusted-publishing support
        run: npm install --global --ignore-scripts npm@11.19.0

      - name: Verify release tag matches package version
        run: node -e 'const version=require("./package.json").version; if (![version, `v${version}`].includes(process.env.GITHUB_REF_NAME)) { throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} does not match package ${version}`) }'

      - name: Install dependencies without transitive install scripts
        run: npm ci --ignore-scripts

      - name: Validate source and package
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run verify:package
          npm audit --omit=dev

      - name: Verify production graph without optional dependencies
        run: |
          npm prune --omit=dev --omit=optional --ignore-scripts
          npm run verify:annex-runtime

      # 이 레포의 정규 경로는 로컬 `npm publish` 다(CLAUDE.md — npm 쪽 trusted publisher
      # 미등록). Release 는 게시 후에 만들므로 같은 버전이 이미 레지스트리에 있고,
      # 그대로 publish 하면 EPUBLISHCONFLICT 로 실패한다. 이미 있으면 게시를 건너뛰고
      # 위 검증(typecheck·test·build·verify:package·audit)만 릴리스 시점 재확인으로 남긴다.
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "korean-law-mcp@${version}" version --loglevel=error > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "korean-law-mcp@${version} is already published — skipping publish step."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm trusted publishing and provenance
        if: steps.registry.outputs.published == 'false'
        run: npm publish --ignore-scripts --access public --provenance
