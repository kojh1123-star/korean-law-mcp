name: Secret scanning

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # No npm dependency installation, third-party action, or repository secret.
      - name: Install checksum-pinned scanner
        run: npm run security:install
      - name: Verify prevention controls
        run: npm run security:test
      - name: Scan complete available history including merges
        run: npm run security:history

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev
